            animation: fadeIn 0.7s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {

            box-shadow: 0 8px 20px -4px rgba(10, 102, 194, 0.6);
